name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install ruff
        run: python -m pip install "ruff>=0.6"
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Tests
        run: python -m pytest -q --cov=retail_lakehouse --cov-report=term-missing:skip-covered
      - name: CLI smoke test (tiny scale)
        run: |
          retail-lakehouse --data-dir /tmp/rlh/data --reports-dir /tmp/rlh/reports \
            --docs-dir /tmp/rlh/docs run-all --scale tiny --workers 2
          python -m retail_lakehouse lineage --select +gold.mart_rfm

  docker:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t retail-analytics-lakehouse:ci .
      - name: Smoke test image
        run: docker run --rm retail-analytics-lakehouse:ci retail-lakehouse --version
