# Copy to lakehouse.yaml (gitignored) to override the package defaults.
# Precedence: package defaults < --scale preset < this file < RLH__SECTION__KEY env vars < CLI flags.

paths:
  data_dir: data
  reports_dir: reports
  docs_dir: docs

generator:
  seed: 42
  customers: 25000
  start: 2024-01-01
  end: 2025-12-31
  dq_issue_rate: 0.015      # ~1.5% of rows get an injected data-quality problem
  late_arrival_rate: 0.01

resources:
  workers: auto             # physical cores - 1
  duckdb_threads: auto      # physical cores
  duckdb_memory_limit: auto # min(2 GiB, 25% of total RAM, 50% of available RAM)

quality:
  fail_on_error: true
